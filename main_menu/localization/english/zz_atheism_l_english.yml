 atheism_noble_renunciation: "Renunciation of Feudal Privileges"
 atheism_noble_renunciation_desc: "The [ShowEstateTypeName('nobles_estate')] may keep their titles and their lands, but the dues, tolls and jurisdictions that once made them masters of every village are abolished. The peasantry celebrates; the great families do not. In exchange the crown takes over the functions the nobility can no longer perform."
 atheism_officer_academy: "Secular Officer Academy"
 atheism_officer_academy_desc: "A state that has abolished the church cannot let the [ShowEstateTypeName('nobles_estate')] monopolise its officer corps. A new academy trains gentlemen in mathematics, fortification and natural philosophy, and grants commissions on merit as much as on birth. The nobility grumbles about the new men - but sends its sons anyway."
 atheism_chartered_societies: "Chartered Philosophical Societies"
 atheism_chartered_societies_desc: "Learned societies receive royal charters to correspond, experiment and publish without episcopal oversight. The [ShowEstateTypeName('burghers_estate')] fund them, the [ShowEstateTypeName('clergy_estate')] staff them, and the state gains an endless supply of useful knowledge - along with merchants who now consider themselves philosophers."
 atheism_free_press: "Free Press"
 atheism_free_press_desc: "No licence, no imprimatur, no bishop's censor. Anyone with a press may print what they can defend in argument. The state gains a literate and argumentative public; the nobility and the old church lose their monopoly on what may be said."
 atheism_abolition_of_the_tithe: "Abolition of the Tithe"
 atheism_abolition_of_the_tithe_desc: "The tenth part of every harvest that once fed the [ShowEstateTypeName('clergy_estate')] is remitted to the [ShowEstateTypeName('peasants_estate')]. In return the state collects a modest land tax directly, and the common people learn that the new order can be generous as well as rational."
 atheism_village_schools: "Village Schools"
 atheism_village_schools_desc: "Every parish is to maintain a school where children learn letters, arithmetic and the elements of natural philosophy. It costs the treasury dear and offends those who preferred an ignorant peasantry, but a state that trusts in reason cannot leave its people unable to read it."

 atheism_supremacy_of_reason: "Supremacy of Reason"
 atheism_supremacy_of_reason_desc: "The state no longer merely tolerates the philosophers - it is their instrument. Reason becomes the official basis of law, education and diplomacy, and the state's academies receive a permanent endowment. With revelation dethroned, war against the remaining churches becomes a matter of principle rather than of piety."

 cb_atheism_war_of_reason: "War of Reason"
 cb_atheism_war_of_reason_PROV: "$cb_atheism_war_of_reason$ targeting [PROVINCE.GetName]"
 cb_atheism_war_of_reason_desc: "The churches that still bind their peoples in superstition are the last obstacle to a rational order. We will carry the Enlightenment at the point of a bayonet if we must."

 atheism_crack_old_ruling_class: "Crack Down on the Old Ruling Class"
 atheism_crack_old_ruling_class_desc: "The aristocracy and the old church hierarchy are stripped of their grip on the state. Their lands and offices pass to the merchants and commoners who actually produce the wealth of the realm - and who have no reason to defend the old order."
 atheism_natural_philosophy: "Natural Philosophy"
 atheism_natural_philosophy_desc: "Observation, experiment and mathematics replace scholastic commentary. The state's scholars are encouraged to investigate the world as it is, and their findings are put to use in medicine, mining and manufacture."
 atheism_popular_sovereignty: "Popular Sovereignty"
 atheism_popular_sovereignty_desc: "Legitimate authority derives from the people, not from a crown blessed by a church. The crown remains as an executive, but its power is balanced by the merchants and commons who consent to be governed."
 atheism_public_education: "Public Education"
 atheism_public_education_desc: "A literate people is a reasoning people. The state funds schools in every city and rewards teachers, and the children of commoners learn the same letters as the children of noblemen."
 atheism_secular_charity: "Secular Charity"
 atheism_secular_charity_desc: "Care for the poor, the sick and the orphaned is a duty of the state, not a favour sold by the church. Hospitals and almshouses are founded and administered by laymen, and the poor learn to look to the commonwealth rather than to heaven."
 atheism_meritocratic_advancement: "Meritocratic Advancement"
 atheism_meritocratic_advancement_desc: "Office and honour are open to whoever can pass the examinations, regardless of birth. The nobility chafes at the competition, but the state gains a bureaucracy that answers to talent."

 atheism_reason_over_revelation: "Reason over Revelation"
 atheism_reason_over_revelation_desc: "It is now established doctrine that no scripture can override the conclusions of reason. The state's laws are examined for their rational basis, and the old claims of the churches are treated as matters of private opinion."
 atheism_secular_administration: "Secular Administration"
 atheism_secular_administration_desc: "The bureaucracy is purged of ecclesiastical officials and learned laymen take their place, creating an administration loyal to the state alone."
 atheism_pamphlet_war: "War of Pamphlets"
 atheism_pamphlet_war_desc: "The presses of the realm turn out cheap pamphlets arguing the atheist case in language any townsman can follow. Literacy climbs, and the old clergy discover that they cannot answer what they cannot read."
 atheism_natural_law: "Natural Law"
 atheism_natural_law_desc: "Jurists, philosophers and physicists collaborate on a single system of natural law: a set of principles supposed to govern both the physical universe and human society. The state adopts it as the foundation of its legal education."
 atheism_public_academies: "Public Academies"
 atheism_public_academies_desc: "The state founds academies in every great city, endowed from the treasury and open to talent. Their laboratories and observatories begin to produce the research that the old universities would never have attempted."
 atheism_civil_service: "Civil Service"
 atheism_civil_service_desc: "A professional bureaucracy of salaried officials, selected by examination and answerable to the state, replaces the personal servants of noble patrons."
 atheism_secular_army: "The Secular Army"
 atheism_secular_army_desc: "The army swears its oath to the state and the constitution rather than to a church or a king's conscience. Discipline is codified, merit is rewarded, and the officer corps is expected to read as well as fight."
 atheism_republic_of_letters: "Republic of Letters"
 atheism_republic_of_letters_desc: "Scholars and artists across Europe correspond with the academies of the atheist state. Prestige flows to the state that has become the intellectual capital of the age."
 atheism_reason_ascendant: "Reason Ascendant"
 atheism_reason_ascendant_desc: "The state now openly professes reason as the sole authority in public life. Priests are reduced to private teachers, and civic ceremonies celebrate the achievements of philosophy and science."
 atheism_scientific_agriculture: "Scientific Agriculture"
 atheism_scientific_agriculture_desc: "Agronomists study soil, seed and rotation in the state's academies, and their findings are taught to landholders. Yields rise and the ancient fear of famine begins to loosen its grip."
 atheism_enlightened_administration: "Enlightened Administration"
 atheism_enlightened_administration_desc: "The state measures, surveys and rationalises its own machinery: salaries, populations, roads, taxes. A government that counts accurately rules more justly and more cheaply."
 atheism_revolutionary_republic: "Revolutionary Republic"
 atheism_revolutionary_republic_desc: "The atheist state declares itself a republic of citizens, not subjects. The land question is settled in favour of the peasantry, and the old dynasty of privilege is consigned to history."
