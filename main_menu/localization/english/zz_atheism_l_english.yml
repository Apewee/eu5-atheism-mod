l_english:
 atheism: "Atheism"
 atheism_ADJ: "Atheist"
 atheism_desc: "Atheism is not a church but a conclusion: the universe runs on natural law, and no revelation, scripture or hierarchy of priests may claim authority over it. Its adherents are philosophers, naturalists, physicians and pamphleteers - the Free Thinkers - who hold that reason, observation and open debate are the only guides worthy of civilised people. A state that adopts Atheism formally divorces the institutions of faith from the institutions of government."
 atheist_group: "Freethought"
 atheist_group_ADJ: "Freethought"
 atheist_group_desc: "Freethought is not a revelation but a method: every claim, sacred or secular, must answer to reason. Its adherents range from deists who still see a clockmaker's hand in nature to outright materialists, united only in their rejection of clerical authority."
 clergy_estate_free_thinkers: "Free Thinkers"
 sponsor_a_radical_thinker.title: "Sponsor a Radical Thinker"
 sponsor_a_radical_thinker.desc: "For years the salons and lecture halls of our realm have echoed with dangerous ideas. Now one man has gone further than the rest: in a pamphlet passed from hand to hand he argues that the universe needs no God, that scripture is a human invention, and that the [ShowEstateTypeName('clergy_estate')] have lived for centuries on the credulity of princes.\n\nThe clergy demand he be silenced. His students demand he be heard. If we fund his research and place him under our protection, he will publish a system of natural philosophy that makes the church redundant - and the state its heir."
 sponsor_a_radical_thinker.a: "Let him speak."
 atheism_sponsored_free_thinking: "Sponsored Free Thinking"
 atheism_sponsored_free_thinking_desc: "The [ShowEstateTypeName('clergy_estate')] are granted a permanent stipend to pursue whatever questions interest them: astronomy, anatomy, mechanics, mathematics. They answer to no bishop and publish without censorship. The treasury grumbles at the expense, and the thinkers grow very influential indeed."
 atheism_cult_of_reason: "Cult of Reason"
 atheism_cult_of_reason_desc: "The state now celebrates Reason itself. Civic ceremonies replace the Mass, philosophers take the place of saints, and the anniversary of the liberation of the mind is marked with processions and orations. The [ShowEstateTypeName('clergy_estate')] preside over it all, and the crown becomes the servant of its own philosophers."
 atheism_civic_festivals: "Civic Festivals"
 atheism_civic_festivals_desc: "Every feast day of the old faith is replaced with a festival of the city: games, public lectures, bread and wine distributed in the squares. The people are entertained, instructed and - most importantly - kept from the churches. It is expensive, but no government that has abolished heaven can afford a joyless capital."

 atheism_movement: "Atheism"
 atheism_movement_desc: "The salons have become a school. Pamphlets arguing that the universe runs on natural law pass from hand to hand, and men who once debated only the finer points of scripture now ask whether any scripture is needed at all. The movement grows wherever there are presses, universities and readers."
